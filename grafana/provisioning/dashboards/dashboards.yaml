# Grafana dashboard provisioning for AgentOps.
#
# Points Grafana at the *same* directory the JSONs live in inside the
# container. docker-compose.yml mounts `./grafana/provisioning` to
# `/etc/grafana/provisioning`, so this path resolves to where the four
# `0?-*.json` files sit at startup. `updateIntervalSeconds: 10` lets us hot-
# reload dashboard edits during the demo without restarting Grafana.
apiVersion: 1

providers:
  - name: agentops
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
